name: Build finalpool

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-finalpool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble implemented tasks
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          rm -rf tasks/finalpool
          mkdir -p tasks/finalpool
          copy_task() {
            local branch="$1" source="$2" task="$3"
            git archive "origin/${branch}" "${source}" | tar -x
            cp -a "${source}" "tasks/finalpool/${task}"
            rm -rf "${source}"
          }
          copy_task lueyang-dev tasks/lueyang/activity-logger activity-logger
          copy_task yuzhen-dev tasks/yuzhen/alert-system alert-system
          copy_task lv tasks/lv/analytics-dashboard analytics-dashboard
          copy_task yuxuan-dev tasks/yuxuan/asset-optimizer asset-optimizer
          copy_task xiaochen_dev tasks/xiaochen/backup-utility backup-utility
          copy_task gyy tasks/gyy/blog-engine blog-engine
          copy_task junteng_dev tasks/junteng/booking-system booking-system
          copy_task wenshuo-dev tasks/wenshuo/cache-optimizer cache-optimizer
          copy_task junteng_dev tasks/junteng/calendar-sync calendar-sync
          copy_task ruige tasks/ruige/canvas-automation canvas-automation
          copy_task jl_dev tasks/jl/canvas-grade-automation canvas-grade-automation
          copy_task zhaochen tasks/zhaochen/certificate-manager certificate-manager
          copy_task lv tasks/lv/chat-bot chat-bot
          copy_task lueyang-dev tasks/lueyang/client-portal client-portal
          copy_task gyy tasks/gyy/cms-builder cms-builder
          copy_task junteng_dev tasks/junteng/contact-manager contact-manager
          copy_task yuxuan-dev tasks/yuxuan/content-manager content-manager
          copy_task gyy tasks/gyy/content-scheduler content-scheduler
          copy_task fan-dev tasks/fan/coupon-manager coupon-manager
          copy_task lueyang-dev tasks/lueyang/crm-system crm-system
          copy_task jl_dev tasks/jl/customer-feedback-processor customer-feedback-processor
          copy_task ruige tasks/ruige/data-analytics data-analytics
          copy_task yuzhen-dev tasks/yuzhen/data-validator data-validator
          copy_task lueyang-dev tasks/lueyang/deal-manager deal-manager
          copy_task xiaochen_dev tasks/xiaochen/deployment-tool deployment-tool
          copy_task fan-dev tasks/fan/discount-calculator discount-calculator
          copy_task lueyang-dev tasks/lueyang/email-campaign email-campaign
          copy_task jl_dev tasks/jl/email-classification-system email-classification-system
          copy_task xiaochen_dev tasks/xiaochen/error-tracker error-tracker
          copy_task ruige tasks/ruige/expense-tracker expense-tracker
          copy_task lv tasks/lv/feedback-collector feedback-collector
          copy_task ruige tasks/ruige/file-manager file-manager
          copy_task lueyang-dev tasks/lueyang/follow-up-reminder follow-up-reminder
          copy_task yuzhen-dev tasks/yuzhen/form-builder form-builder
          copy_task xiaochen_dev tasks/xiaochen/health-monitor health-monitor
          copy_task junteng_dev tasks/junteng/help-desk help-desk
          copy_task wenshuo-dev tasks/wenshuo/image-processor image-processor
          copy_task jl_dev tasks/jl/inventory-management inventory-management
          copy_task yuzhen-dev tasks/yuzhen/invoice-generator invoice-generator
          copy_task zhaochen tasks/zhaochen/load-balancer load-balancer
          copy_task ruige tasks/ruige/log-analyzer log-analyzer
          copy_task fan-dev tasks/fan/loyalty-program loyalty-program
          copy_task haoze tasks/haoze/media-organizer media-organizer
          copy_task xiaochen_dev tasks/xiaochen/monitoring-agent monitoring-agent
          copy_task yuxuan-dev tasks/yuxuan/network-analyzer network-analyzer
          copy_task junteng_dev tasks/junteng/order-processor order-processor
          copy_task yuzhen-dev tasks/yuzhen/payment-processor payment-processor
          copy_task jl_dev tasks/jl/pdf-report-generator pdf-report-generator
          copy_task yuzhen-dev tasks/yuzhen/permission-manager permission-manager
          copy_task lv tasks/lv/personalization-service personalization-service
          copy_task fan-dev tasks/fan/price-tracker price-tracker
          copy_task junteng_dev tasks/junteng/product-catalog product-catalog
          copy_task junxian_dev tasks/junxian/qr-generator qr-generator
          copy_task junteng_dev tasks/junteng/reminder-service reminder-service
          copy_task gyy tasks/gyy/robots-handler robots-handler
          copy_task lueyang-dev tasks/lueyang/sales-pipeline sales-pipeline
          copy_task wenshuo-dev tasks/wenshuo/scheduler scheduler
          copy_task wenshuo-dev tasks/wenshuo/search-engine search-engine
          copy_task xiaochen_dev tasks/xiaochen/security-scanner security-scanner
          copy_task lv tasks/lv/sentiment-analyzer sentiment-analyzer
          copy_task junteng_dev tasks/junteng/shipment-tracker shipment-tracker
          copy_task junxian_dev tasks/junxian/social-connector social-connector
          copy_task gyy tasks/gyy/social-publisher social-publisher
          copy_task xiaochen_dev tasks/xiaochen/status-checker status-checker
          copy_task zhaochen tasks/zhaochen/storage-manager storage-manager
          copy_task haoze tasks/haoze/streaming-service streaming-service
          copy_task haoze tasks/haoze/subtitle-generator subtitle-generator
          copy_task lv tasks/lv/survey-builder survey-builder
          copy_task yuxuan-dev tasks/yuxuan/sync-service sync-service
          copy_task gyy tasks/gyy/tag-manager tag-manager
          copy_task yuxuan-dev tasks/yuxuan/task-scheduler task-scheduler
          copy_task zhaochen tasks/zhaochen/template-engine template-engine
          copy_task lueyang-dev tasks/lueyang/territory-manager territory-manager
          copy_task junxian_dev tasks/junxian/translation-api translation-api
          copy_task haoze tasks/haoze/video-trimmer video-trimmer
          copy_task lv tasks/lv/voice-processor voice-processor
          copy_task ruige tasks/ruige/web-crawler web-crawler
          find tasks -mindepth 1 -maxdepth 1 -type d -empty -delete
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tasks/finalpool
          git commit -m "Assemble implemented tasks in finalpool"
          git push origin HEAD:finalpool
