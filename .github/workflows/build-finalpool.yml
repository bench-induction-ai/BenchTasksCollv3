          zhaochen|zhaochen|storage-manager
          TASKS
          rm -f .github/workflows/build-finalpool.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tasks/finalpool .github/workflows/build-finalpool.yml
          git commit -m "Build final pool of implemented tasks"
          git push origin HEAD:finalpool
