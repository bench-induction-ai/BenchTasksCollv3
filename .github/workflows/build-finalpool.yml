          zhaochen|zhaochen|certificate-manager
          zhaochen|zhaochen|storage-manager
          TASKS
          test "$(find tasks/finalpool -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 79
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tasks/finalpool
          git commit -m "Add all 79 implemented tasks to finalpool"
          git push origin HEAD:finalpool
